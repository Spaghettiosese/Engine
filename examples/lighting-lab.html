<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lighting Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="examples.css">
</head>
<body>
<canvas class="stage" id="stage" aria-label="Lighting Lab: material spheres lit by moving coloured lights"></canvas>
<div class="hud">
  <div class="card title"><span class="mark">SF</span><div><h1>Lighting Lab</h1><small>ShapeForge V2 example · lights, materials, post</small></div></div>
  <div class="card keys hide-sm">Drag to orbit · right-drag to pan · wheel to zoom<br><b>Click the floor</b> to drop a light (up to 10)</div>
  <div class="card" style="display:grid;gap:6px">
    <div class="row"><label for="tod">Time</label><input id="tod" type="range" min="0" max="24" step="0.05" value="20.4"><output id="todOut"></output></div>
    <div class="row"><label for="exp">Exposure</label><input id="exp" type="range" min="0.4" max="2.5" step="0.05" value="1"><output id="expOut"></output></div>
    <div class="row"><label for="bloom">Bloom</label><input id="bloom" type="range" min="0" max="0.8" step="0.01" value="0.22"><output id="bloomOut"></output></div>
    <div class="row"><label for="fog">Ground fog</label><input id="fog" type="range" min="0" max="1" step="0.01" value="0.3"><output id="fogOut"></output></div>
    <div class="row"><label for="lint">Light power</label><input id="lint" type="range" min="0" max="3" step="0.05" value="1"><output id="lintOut"></output></div>
    <div class="toggles">
      <label><input type="checkbox" id="tAO" checked> Ambient occlusion</label>
      <label><input type="checkbox" id="tRays" checked> Light shafts</label>
      <label><input type="checkbox" id="tShadows" checked> Sun shadows</label>
      <label><input type="checkbox" id="tBloom" checked> Bloom</label>
      <label><input type="checkbox" id="tOrbit" checked> Orbiting lights</label>
      <label><input type="checkbox" id="tSpot" checked> Sweeping spot</label>
    </div>
    <div style="display:flex;gap:6px"><button class="btn" id="clear">Clear placed lights</button><button class="btn" id="night">Night</button><button class="btn" id="day">Day</button></div>
  </div>
</div>
<div class="stats card" id="stats"></div>
<nav class="nav"><a href="../index.html">Home</a><a href="frontier-town.html">Frontier Town</a><a href="architect.html">Architect</a></nav>
<div class="fatal" id="fatal" hidden></div>
<script type="module" src="lighting-lab.js"></script>
</body>
</html>
