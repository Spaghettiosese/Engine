<!doctype html>
<html><head><meta charset="utf-8"><title>Pose Sheet</title>
<style>html,body{margin:0;height:100%;background:#222}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Dev tool: ?poses=Clip@time,Clip@time&yaw=deg — one frozen Cowboy per entry, side by side.
import * as E from '../src/engine/index.js';
import { createCowboy } from '../src/content/cowboy.js';
import { createRevolver, HAND_SOCKET, HOLSTER_SOCKET } from '../src/content/revolver.js';
const q = new URLSearchParams(location.search);
const list = (q.get('poses') || 'Idle@0,Walk@0.2').split(',').map((s) => s.split('@'));
const renderer = new E.Renderer(document.getElementById('c'), { pixelRatio: 1, msaa: 2, shadowSize: 1024 });
renderer.settings.ssao = false;
const scene = new E.Scene();
scene.add(new E.Mesh(E.plane({ width: 40, depth: 40 }), new E.Material({ color: '#8a8070', pattern: 'checker', patternScale: 2, patternColor: '#6a6258' })));
const n = list.length, gap = 1.1;
list.forEach(([name, t], k) => {
  const c = createCowboy(); c.autoAnimate = false; c.springs = false;
  c.position.set([(k - (n - 1) / 2) * gap, 0, 0]); c.setEuler(0, +(q.get('yaw') || 0), 0);
  scene.add(c); c.updateWorld(null);
  c.mixer.play(name, { fade: 0 }); c.mixer.setTime(name, +t); c.mixer.evaluate();
  // ?gun=1: revolver in the hand for aim/reload poses, in the holster otherwise
  if (q.get('gun')) { const inHand = /Aim|Recoil|Reload|Quickdraw/.test(name) || (name === 'Draw Revolver' && +t >= 0.2) || (name === 'Holster Revolver' && +t < 0.44); c.attach(createRevolver(), inHand ? 'hand.R' : 'holster', inHand ? HAND_SOCKET : HOLSTER_SOCKET); }
});
const cam = new E.Camera(); cam.fov = 30 * E.DEG;
const d = Math.max(4, n * gap * 1.25);
cam.position.set([0, 1.3, d]); cam.target.set([0, 0.9, 0]);
if (q.get('cam') === 'side') cam.position.set([d, 1.3, 0]);
if (q.get('zoom')) { const z = +q.get('zoom'); cam.position.set([cam.position[0] / z, 1.25, cam.position[2] / z]); cam.target.set([0, 1.1, 0]); }
scene.environment.shadowRadius = n * 0.8 + 2;
let frames = 0; // render a few frames and stop (keeps headless screenshots fast)
function frame() { renderer.render(scene, cam, { background: 'sky' }); if (++frames < 3 || q.get('live')) requestAnimationFrame(frame); }
frame();
</script></body></html>
